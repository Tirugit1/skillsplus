apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillsplus-frontend
  namespace: skillsplus
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
      - name: frontend
        image: skillsplus/frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests: { cpu: "50m", memory: "64Mi" }
          limits:   { cpu: "100m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: skillsplus
spec:
  type: LoadBalancer
  selector: { app: frontend }
  ports:
  - port: 80
    targetPort: 80
